<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orthographic 3D Sierpinski (WebGPU)</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none; /* Prevent scroll on mobile touch */
        }
        #error-msg {
            display: none;
            color: #ff5555;
            font-family: sans-serif;
            text-align: center;
            margin-top: 20%;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div id="error-msg">
        <h2>WebGPU is not supported by your browser.</h2>
        <p>Try opening this in a recent version of Chrome or Edge.</p>
    </div>
    <canvas id="gpuCanvas"></canvas>

    <script type="module">
        async function init() {
            // Check for WebGPU support
            if (!navigator.gpu) {
                document.getElementById('error-msg').style.display = 'block';
                document.getElementById('gpuCanvas').style.display = 'none';
                return;
            }

            const canvas = document.getElementById('gpuCanvas');
            const adapter = await navigator.gpu.requestAdapter();
            if (!adapter) {
                document.getElementById('error-msg').style.display = 'block';
                return;
            }

            const device = await adapter.requestDevice();
            const context = canvas.getContext('webgpu');
            const presentationFormat = navigator.gpu.getPreferredCanvasFormat();

            context.configure({
                device,
                format: presentationFormat,
                alphaMode: 'premultiplied',
            });

            // --- WGSL SHADER SOURCE ---
            const wgslSource = `
                struct Uniforms {
                    resolution: vec2<f32>,
                    mouse: vec2<f32>,
                }

                @group(0) @binding(0) var<uniform> uniforms: Uniforms;

                // Vertex Shader: Hardcoded full-screen quad
                @vertex
                fn vs_main(@builtin(vertex_index) VertexIndex : u32) -> @builtin(position) vec4<f32> {
                    var pos = array<vec2<f32>, 6>(
                        vec2<f32>(-1.0, -1.0),
                        vec2<f32>( 1.0, -1.0),
                        vec2<f32>(-1.0,  1.0),
                        vec2<f32>( 1.0, -1.0),
                        vec2<f32>( 1.0,  1.0),
                        vec2<f32>(-1.0,  1.0)
                    );
                    return vec4<f32>(pos[VertexIndex], 0.0, 1.0);
                }

                // 2D Rotation Matrix
                fn rot(a: f32) -> mat2x2<f32> {
                    let s = sin(a);
                    let c = cos(a);
                    return mat2x2<f32>(c, -s, s, c);
                }

                // Sierpinski Tetrahedron Distance Estimator
                fn sdSierpinski(p_in: vec3<f32>) -> f32 {
                    var p = p_in;

                    // Mouse-based 3D Rotation
                    let rotY = rot(uniforms.mouse.x * 6.28318); // Left-Right mouse movement
                    let rotX = rot(uniforms.mouse.y * 6.28318); // Up-Down mouse movement

                    // Apply Y rotation (affects X and Z)
                    let xz = rotY * vec2<f32>(p.x, p.z);
                    p.x = xz.x;
                    p.z = xz.y;

                    // Apply X rotation (affects Y and Z)
                    let yz = rotX * vec2<f32>(p.y, p.z);
                    p.y = yz.x;
                    p.z = yz.y;

                    var scale: f32 = 1.0;

                    // Fold space 8 times to create the fractal
                    for (var i = 0; i < 8; i++) {
                        // Strict WGSL assignment avoiding complex left-hand swizzling
                        if (p.x + p.y < 0.0) {
                            let temp = -vec2<f32>(p.y, p.x);
                            p.x = temp.x; p.y = temp.y;
                        }
                        if (p.x + p.z < 0.0) {
                            let temp = -vec2<f32>(p.z, p.x);
                            p.x = temp.x; p.z = temp.y;
                        }
                        if (p.y + p.z < 0.0) {
                            let temp = -vec2<f32>(p.z, p.y);
                            p.y = temp.x; p.z = temp.y;
                        }

                        // Scale and offset
                        p = p * 2.0 - vec3<f32>(1.0, 1.0, 1.0);
                        scale *= 2.0;
                    }

                    // Return distance to the base tetrahedron, adjusted by scale
                    return (length(p) - 1.0) / scale;
                }

                // Calculate normals for lighting based on SDF gradient
                fn calcNormal(p: vec3<f32>) -> vec3<f32> {
                    let e = vec2<f32>(0.001, 0.0);
                    let nx = sdSierpinski(p + vec3<f32>(e.x, e.y, e.y)) - sdSierpinski(p - vec3<f32>(e.x, e.y, e.y));
                    let ny = sdSierpinski(p + vec3<f32>(e.y, e.x, e.y)) - sdSierpinski(p - vec3<f32>(e.y, e.x, e.y));
                    let nz = sdSierpinski(p + vec3<f32>(e.y, e.y, e.x)) - sdSierpinski(p - vec3<f32>(e.y, e.y, e.x));
                    return normalize(vec3<f32>(nx, ny, nz));
                }

                @fragment
                fn fs_main(@builtin(position) coord: vec4<f32>) -> @location(0) vec4<f32> {
                    // Normalize pixel coordinates (from -1 to 1)
                    let uv = (coord.xy - 0.5 * uniforms.resolution.xy) / uniforms.resolution.y;

                    // ORTHOGRAPHIC CAMERA SETUP
                    let orthoSize: f32 = 2.5;
                    let ro = vec3<f32>(uv * orthoSize, -3.0);
                    let rd = vec3<f32>(0.0, 0.0, 1.0);

                    // Raymarching Loop
                    var t: f32 = 0.0;
                    var d: f32 = 0.0;
                    for(var i = 0; i < 100; i++) {
                        let p = ro + rd * t;
                        d = sdSierpinski(p);
                        if(d < 0.001 || t > 10.0) { break; }
                        t += d;
                    }

                    // Shading and Coloring
                    var color = vec3<f32>(0.05, 0.05, 0.08); // Background color

                    if(t < 10.0) { // If we hit the fractal
                        let p = ro + rd * t;
                        let n = calcNormal(p);

                        // Simple directional lighting
                        let lightDir = normalize(vec3<f32>(1.0, 1.0, -1.0));
                        let diff = max(dot(n, lightDir), 0.0);

                        // Ambient occlusion based on iteration count / distance
                        let ao = clamp(1.0 - t * 0.15, 0.0, 1.0);

                        // Base color mixed with lighting
                        let baseColor = vec3<f32>(0.9, 0.6, 0.3); // Copper/orange tone
                        color = baseColor * diff * ao + (baseColor * 0.2); // Add ambient light
                    }

                    return vec4<f32>(color, 1.0);
                }
            `;

            // --- WEBGPU BOILERPLATE & PIPELINE ---
            const shaderModule = device.createShaderModule({ code: wgslSource });

            const pipeline = device.createRenderPipeline({
                layout: 'auto',
                vertex: {
                    module: shaderModule,
                    entryPoint: 'vs_main',
                },
                fragment: {
                    module: shaderModule,
                    entryPoint: 'fs_main',
                    targets: [{ format: presentationFormat }],
                },
                primitive: {
                    topology: 'triangle-list',
                },
            });

            // Uniform Buffer (2 vec2s = 4 floats = 16 bytes)
            const uniformBuffer = device.createBuffer({
                size: 16,
                usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
            });

            const bindGroup = device.createBindGroup({
                layout: pipeline.getBindGroupLayout(0),
                entries: [{
                    binding: 0,
                    resource: { buffer: uniformBuffer }
                }]
            });

            // Data array to send to the GPU
            const uniformData = new Float32Array(4);

            // --- INPUT HANDLING ---
            let mouseX = 0.1; // Default rotation
            let mouseY = 0.05;

            function updateMouse(x, y) {
                // Normalize to [0.0, 1.0]
                mouseX = x / canvas.clientWidth;
                mouseY = y / canvas.clientHeight;
            }

            window.addEventListener('mousemove', (e) => updateMouse(e.clientX, e.clientY));
            window.addEventListener('touchmove', (e) => {
                if(e.touches.length > 0) {
                    updateMouse(e.touches[0].clientX, e.touches[0].clientY);
                }
            });

            // --- RENDER LOOP ---
            function render() {
                // Handle canvas resize
                const displayWidth = canvas.clientWidth;
                const displayHeight = canvas.clientHeight;
                if (canvas.width !== displayWidth || canvas.height !== displayHeight) {
                    canvas.width = displayWidth;
                    canvas.height = displayHeight;
                }

                // Update uniform data
                uniformData[0] = canvas.width;
                uniformData[1] = canvas.height;
                uniformData[2] = mouseX;
                uniformData[3] = mouseY;

                // Write uniforms to GPU
                device.queue.writeBuffer(uniformBuffer, 0, uniformData);

                // Setup rendering commands
                const commandEncoder = device.createCommandEncoder();
                const textureView = context.getCurrentTexture().createView();

                const renderPassDescriptor = {
                    colorAttachments: [{
                        view: textureView,
                        clearValue: { r: 0.0, g: 0.0, b: 0.0, a: 1.0 },
                        loadOp: 'clear',
                        storeOp: 'store',
                    }],
                };

                const passEncoder = commandEncoder.beginRenderPass(renderPassDescriptor);
                passEncoder.setPipeline(pipeline);
                passEncoder.setBindGroup(0, bindGroup);
                passEncoder.draw(6, 1, 0, 0); // Draw 6 vertices (our quad)
                passEncoder.end();

                device.queue.submit([commandEncoder.finish()]);

                requestAnimationFrame(render);
            }

            requestAnimationFrame(render);
        }

        init();
    </script>
</body>
</html>
